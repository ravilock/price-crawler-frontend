name: ${COMPOSE_PROJECT_NAME:-price-frontend-local}
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-price}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}
    ports:
    - 127.0.0.1:${RABBITMQ_PORT:-19772}:5672
    - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-19773}:15672
    volumes:
    - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command:
    - start-dev
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set local Keycloak password}
      KC_HOSTNAME: ${OIDC_BASE_URL:-http://localhost:19781}
    ports:
    - 127.0.0.1:${KEYCLOAK_PORT:-19781}:8080
    volumes:
    - keycloak-data:/opt/keycloak/data
    - ./local/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /realms/price-intelligence/.well-known/openid-configuration HTTP/1.0\r\nHost:
        localhost\r\nConnection: close\r\n\r\n" >&3; response=; while IFS= read -r -t 4 line || [[ -n "$$line" ]]; do response+="$$line";
        done <&3; [[ "$$response" == *"\"issuer\":\"$$KC_HOSTNAME/realms/price-intelligence\""* ]]'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  alerts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local PostgreSQL password}
    ports:
    - 127.0.0.1:${ALERTS_POSTGRES_PORT:-19735}:5432
    volumes:
    - alerts-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1"
        | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    profiles: &id001
    - monitoring
  alerts:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-alerts:${ALERTS_IMAGE_TAG-287d149c2eec87cb4928a535fe7d4671a8fb64ec}
    environment:
      HTTP_ADDR: :8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      DATABASE_URL: postgres://alerts:${POSTGRES_PASSWORD:?Set local PostgreSQL password}@alerts-db:5432/alerts?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      alerts-db:
        condition: service_healthy
    profiles: *id001
  catalog-comparison-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local PostgreSQL password}
    ports:
    - 127.0.0.1:${CATALOG_COMPARISON_POSTGRES_PORT:-19736}:5432
    volumes:
    - catalog-comparison-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1"
        | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    profiles: &id002
    - catalog
    - monitoring
  catalog-comparison:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-catalog-comparison:${CATALOG_COMPARISON_IMAGE_TAG-43c2d4949801d38dcbde0927399e69bb8bbf9a10}
    environment:
      HTTP_ADDR: :8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      DATABASE_URL: postgres://catalog:${POSTGRES_PASSWORD:?Set local PostgreSQL password}@catalog-comparison-db:5432/catalog?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-comparison-db:
        condition: service_healthy
    profiles: *id002
  crawler-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local PostgreSQL password}
    ports:
    - 127.0.0.1:${CRAWLER_POSTGRES_PORT:-19733}:5432
    volumes:
    - crawler-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1"
        | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    profiles: &id003
    - collection
    - rendered
    - monitoring
  crawler:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-crawler:${CRAWLER_IMAGE_TAG-31c8ff5c57be3921c41b9d7662b498623199861c}
    environment:
      HTTP_ADDR: :8081
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      DATABASE_URL: postgres://crawler:${POSTGRES_PASSWORD:?Set local PostgreSQL password}@crawler-db:5432/crawler?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      crawler-db:
        condition: service_healthy
    profiles: *id003
  data-finder:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-data-finder:${DATA_FINDER_IMAGE_TAG-2ea7fa5f575a837098e3ef0b39159fbf709777ee}
    environment:
      HTTP_ADDR: :8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles:
    - collection
    - rendered
  renderer-parser:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-renderer-parser:${RENDERER_PARSER_IMAGE_TAG-ddaf34498116770221c311bc96df249c3d036beb}
    environment:
      HTTP_ADDR: :8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles:
    - rendered
  tenant-admin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenant
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local PostgreSQL password}
    ports:
    - 127.0.0.1:${TENANT_ADMIN_POSTGRES_PORT:-19734}:5432
    volumes:
    - tenant-admin-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1"
        | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    profiles: &id004
    - tenant
  tenant-admin:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-tenant-admin:${TENANT_ADMIN_IMAGE_TAG-a5a10ee6353320568eb341732d25ce305fcf7b37}
    environment:
      HTTP_ADDR: :8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      DATABASE_URL: postgres://tenant:${POSTGRES_PASSWORD:?Set local PostgreSQL password}@tenant-admin-db:5432/tenant?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      tenant-admin-db:
        condition: service_healthy
    profiles: *id004
  user-api:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-user-api:${USER_API_IMAGE_TAG-06b665889d7087c14eca709497edb57c046f3a26}
    environment:
      HTTP_ADDR: :8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      OIDC_ISSUER: ${OIDC_BASE_URL:-http://localhost:19781}/realms/price-intelligence
      OIDC_JWKS_URL: http://keycloak:8080/realms/price-intelligence/protocol/openid-connect/certs
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
    - 127.0.0.1:${USER_API_PORT:-19782}:8080
  app:
    build:
      context: .
    environment:
      API_URL: ${API_URL-http://localhost:${USER_API_PORT:-19782}}
      OIDC_ISSUER: ${OIDC_ISSUER-${OIDC_BASE_URL:-http://localhost:19781}/realms/price-intelligence}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID-price-intelligence-spa}
    depends_on:
      user-api:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
    - 127.0.0.1:${APP_PORT:-19780}:80
    profiles:
    - app
volumes:
  rabbit-data: {}
  keycloak-data: {}
  alerts-data: {}
  catalog-comparison-data: {}
  crawler-data: {}
  tenant-admin-data: {}
